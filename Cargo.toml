[package]
name = "rootchat"
version = "2.0.0"
edition = "2021"
description = "RootChat - native Rust messenger (Telegram style)"

[lib]
name = "rootchat"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rootchat-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2"] }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fastrand = "2"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"
ndk-context = "0.1"
android-activity = { version = "0.6", features = ["native-activity"] }
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[package.metadata.android]
package = "com.aryanweblabs.rootchat"
apk_name = "RootChat"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "RootChat"
theme = "@android:style/Theme.Material.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|uiMode"
launch_mode = "singleTop"
orientation = "portrait"
window_soft_input_mode = "adjustResize"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rootchat_jni_check)'] }

[dev-dependencies]
png = "0.17"
