name: Build RootChat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: NDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Fonts (Inter)
        run: |
          mkdir -p fonts
          if [ ! -f fonts/Inter-Regular.otf ]; then
            sudo apt-get update -y && sudo apt-get install -y fonts-inter
            for w in Regular SemiBold; do
              f=$(find /usr/share/fonts -name "Inter-$w.otf" -o -name "Inter-$w.ttf" | head -n1)
              if [ -n "$f" ] && [ "${f##*.}" = "otf" ]; then cp "$f" fonts/Inter-$w.otf; fi
            done
          fi
          ls -la fonts
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-apk --locked
      - name: Keystore
        run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/rootchat.jks -alias rootchat \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rootchat123 -keypass rootchat123 \
            -dname "CN=RootChat, O=Aryanweblabs, C=IN"
      - name: Build release APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/rootchat.jks
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: rootchat123
        run: cargo apk build --release --lib
      - uses: actions/upload-artifact@v4
        with:
          name: RootChat-apk
          path: target/release/apk/RootChat.apk
